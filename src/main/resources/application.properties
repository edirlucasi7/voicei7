spring.application.name=icety
spring.config.import=optional:file:.env[.properties]

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5:3b}
spring.ai.ollama.chat.options.temperature=0.0
spring.ai.ollama.init.pull-model-strategy=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/icety}
spring.datasource.username=${DB_USERNAME:icety}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
reservation.heartbeat-interval=${RESERVATION_HEARTBEAT_INTERVAL:30s}
reservation.call-timeout=${RESERVATION_CALL_TIMEOUT:2m}
reservation.cleanup-interval=${RESERVATION_CLEANUP_INTERVAL:30s}
schedule.closed-days=${SCHEDULE_CLOSED_DAYS:SUNDAY}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Embedding dimensions must match the Flyway vector schema. Changing models requires reindexing.
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
knowledge.directory=${KNOWLEDGE_DIRECTORY:knowledge}
knowledge.ingest-on-startup=${KNOWLEDGE_INGEST_ON_STARTUP:true}
knowledge.search.top-k=${KNOWLEDGE_TOP_K:4}
knowledge.search.threshold=${KNOWLEDGE_SIMILARITY_THRESHOLD:0.5}
